[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbridge"
version = "0.1.0"
description = "Controlled physical-field material inference experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.7,<2.9", "torchvision>=0.22,<0.24", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
